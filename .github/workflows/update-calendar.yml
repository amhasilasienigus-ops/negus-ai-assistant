name: Update Calendar and Send Push Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_push:
        description: 'Send a test push notification to subscribed devices'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: calendar-push-monitor
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Forex Factory calendar
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json \
            -o calendar.json

      - name: Validate calendar
        run: |
          jq -e 'type == "array" and length > 0 and any(.[]; .country == "USD" or .country == "EUR")' calendar.json

      - name: Send OneSignal push alerts
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SEND_TEST_PUSH: ${{ inputs.send_test_push }}
        run: node .github/scripts/notify-calendar.mjs

      - name: Save calendar and notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json .github/state/notification-state.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update calendar and notification state"
            git push
          fi
