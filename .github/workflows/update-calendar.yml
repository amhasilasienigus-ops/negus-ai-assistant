name: Update Calendar and Send Push Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_push:
        description: 'Send a test push notification to subscribed devices'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: calendar-push-monitor
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Forex Factory calendar
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json \
            -o calendar.json

      - name: Validate calendar
        run: |
          jq -e 'type == "array" and length > 0 and any(.[]; .country == "USD" or .country == "EUR")' calendar.json

      - name: Enrich released results from Trading Economics (optional API key)
        if: ${{ secrets.TRADING_ECONOMICS_API_KEY != '' }}
        continue-on-error: true
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: node .github/scripts/enrich-calendar.mjs

      - name: Preserve Forex Factory Actual values when no Trading Economics key is configured
        if: ${{ secrets.TRADING_ECONOMICS_API_KEY == '' }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const events=JSON.parse(fs.readFileSync('calendar.json','utf8')); let count=0; for (const e of events) { const v=e.actual ?? e.Actual; if (v !== undefined && v !== null && String(v).trim() !== '' && !['-','—','–','n/a','na','null','none','pending'].includes(String(v).trim().toLowerCase())) { e.actual=String(v).trim(); e.actualAvailable=true; e.actualSource=e.actualSource || 'Forex Factory calendar feed'; count++; } } fs.writeFileSync('calendar.json',JSON.stringify(events,null,2)+'\\n'); console.log('Forex Factory published Actual values preserved:',count);"

      - name: Send OneSignal push alerts
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SEND_TEST_PUSH: ${{ inputs.send_test_push }}
        run: node .github/scripts/notify-calendar.mjs

      - name: Save calendar and notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json .github/state/notification-state.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update calendar and notification state"
            git push
          fi
