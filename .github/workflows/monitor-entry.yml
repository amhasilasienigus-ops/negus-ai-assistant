name: NEGUS EURUSD Background Setup Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_push:
        description: 'Send a test notification to subscribed devices'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: negus-eurusd-setup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EUR/USD setup monitor
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SEND_TEST_PUSH: ${{ inputs.send_test_push }}
        run: node .github/scripts/monitor-entry.mjs

      - name: Save setup notification state
        if: always()
        run: |
          if [ -f .github/state/entry-monitor-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/state/entry-monitor-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update EUR/USD setup monitor state"
              git push
            fi
          fi
